name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skala-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skala-vue/package-lock.json
      - run: npm ci
      - name: debug-secret-length
        run: node -e "console.log('KEY LENGTH:', (process.env.VITE_OPENWEATHER_API_KEY || '').length)"
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      - run: npm run build
        env:
          # 저장소 Settings > Secrets and variables > Actions에 등록하면 배포된 사이트가
          # 처음부터 실제 OpenWeatherMap 데이터를 보여준다. 등록하지 않아도 빌드는 정상
          # 진행되며, 방문자는 상단 내비게이션의 "데모 데이터 보기" 토글로 둘러볼 수 있다.
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      # Vue Router가 history 모드라 새로고침/직접 접속 시 GitHub Pages 기본 404가 뜬다 —
      # index.html을 404.html로도 복사해두면 GitHub Pages가 알 수 없는 경로에서 이 파일을
      # 서빙해 SPA가 라우팅을 이어받을 수 있다(널리 쓰이는 GitHub Pages SPA 우회 방법).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skala-vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
